name: Create licence keys

# One click, no terminal: creates the Ed25519 key pair that signs Pro tokens.
#   - The PRIVATE key goes straight into the Worker secret LICENCE_SIGNING_KEY (Cloudflare). It is masked, never
#     printed, never uploaded as an artifact, and the temp file is deleted at the end of the job.
#   - The PUBLIC key is printed in the run summary. Copy it into the repository variable LICENCE_PUBLIC_KEY
#     (Settings -> Secrets and variables -> Actions -> Variables), then run the Deploy workflow so the website is
#     rebuilt with it. The pricing page keeps "Coming soon" until both keys are in place.
# Replacing an existing key logs out every Pro browser of that environment until it refreshes with a new token, so a
# key that already exists is kept unless "replace" is ticked. Production also needs the actor in RELEASE_APPROVERS.
# Needs the same repository secrets as deploy.yml: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Worker environment: staging (finealth-staging), prelaunch or production (finealth)'
        required: true
        type: choice
        options: [staging, prelaunch, production]
        default: staging
      replace:
        description: 'Replace a key that is already set (signs out existing Pro browsers until they refresh)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: licence-keys-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check approver for production
        if: inputs.environment == 'production'
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.RELEASE_APPROVERS }}
        run: echo ",$APPROVERS," | tr -d ' ' | grep -q ",$ACTOR," || { echo "::error::@$ACTOR is not in RELEASE_APPROVERS"; exit 1; }

      - name: Check Cloudflare credentials are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] && exit 0
          echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings -> Secrets and variables -> Actions)"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Stop if a key is already set
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.environment }}
          REPLACE: ${{ inputs.replace }}
        # Lists secret NAMES only; Cloudflare never returns secret values.
        run: |
          names="$(npx wrangler secret list --env "$TARGET" --format json 2>/dev/null || echo '[]')"
          if echo "$names" | grep -q '"LICENCE_SIGNING_KEY"'; then
            if [ "$REPLACE" != "true" ]; then
              echo "::error::LICENCE_SIGNING_KEY is already set on $TARGET. Run again with 'replace' ticked only if you mean to rotate it."
              exit 1
            fi
            echo "::warning::Replacing the existing LICENCE_SIGNING_KEY on $TARGET"
          fi

      - name: Create the key pair and store the private key in Cloudflare
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.environment }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/licence-signing-key"
          pub_file="$RUNNER_TEMP/licence-public-key"
          trap 'rm -f "$key_file"' EXIT
          node -e "
            const fs = require('node:fs');
            (async () => {
              const b64url = (b) => Buffer.from(b).toString('base64url');
              const kp = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
              fs.writeFileSync(process.argv[1], b64url(await crypto.subtle.exportKey('pkcs8', kp.privateKey)), { mode: 0o600 });
              fs.writeFileSync(process.argv[2], b64url(await crypto.subtle.exportKey('raw', kp.publicKey)));
            })();" "$key_file" "$pub_file"
          echo "::add-mask::$(cat "$key_file")"
          npx wrangler secret put LICENCE_SIGNING_KEY --env "$TARGET" < "$key_file"
          pub="$(cat "$pub_file")"
          {
            echo "## Licence keys created for \`$TARGET\`"
            echo
            echo "The private key is stored as the Worker secret \`LICENCE_SIGNING_KEY\`. It was never printed."
            echo
            echo "**Public key** (safe to share). Put it in the repository variable \`LICENCE_PUBLIC_KEY\`:"
            echo
            echo '```'
            echo "$pub"
            echo '```'
            echo
            echo "Then run **Actions -> Deploy -> Run workflow** so the website is rebuilt with it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=LICENCE_PUBLIC_KEY::$pub"
