name: Create licence keys

# One click, no terminal: creates the Ed25519 key pair that signs Pro tokens.
#   - The PRIVATE key goes straight into the Worker secret LICENCE_SIGNING_KEY (Cloudflare). It is masked, never
#     printed, never uploaded as an artifact, and the temp file is deleted at the end of the job.
#   - The PUBLIC key is printed in the run summary with the repository variable to put it in:
#     staging -> LICENCE_PUBLIC_KEY_STAGING, production -> LICENCE_PUBLIC_KEY_PRODUCTION (deploy.yml reads them;
#     each environment has its own pair). Then run the Deploy workflow so the website is rebuilt with it. The pricing
#     page keeps "Coming soon" until both keys are in place.
# "production" means the Worker "finealth" (env from PRODUCTION_WRANGLER_ENV, prelaunch until launch, as in deploy.yml)
# and needs the person who starts the run to be in RELEASE_APPROVERS.
# Replacing an existing key is refused unless "replace" is ticked (production also needs confirm = ROTATE finealth).
# A rotation signs every Pro browser out until the site is redeployed with the new public key, counts their next
# refresh as a new activation, and breaks Pro in installed Android builds until a release with the new key ships.
# Needs the same repository secrets as deploy.yml: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Run it after the first
# Deploy of that environment (it refuses to create a Worker).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'staging (Worker finealth-staging) or production (Worker finealth)'
        required: true
        type: choice
        options: [staging, production]
        default: staging
      replace:
        description: 'Replace a key that is already set. Signs out every Pro user until you redeploy; breaks Pro in installed Android builds'
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Production rotation only: type ROTATE finealth'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: licence-keys-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pick the Worker environment
        id: env
        env:
          TARGET: ${{ inputs.environment }}
          PROD_ENV: ${{ vars.PRODUCTION_WRANGLER_ENV || 'prelaunch' }}
        run: |
          case "$TARGET" in
            staging) echo "wrangler=staging" >> "$GITHUB_OUTPUT"; echo "var=LICENCE_PUBLIC_KEY_STAGING" >> "$GITHUB_OUTPUT" ;;
            production)
              case "$PROD_ENV" in prelaunch|production) ;; *) echo "::error::PRODUCTION_WRANGLER_ENV must be prelaunch or production"; exit 1 ;; esac
              echo "wrangler=$PROD_ENV" >> "$GITHUB_OUTPUT"; echo "var=LICENCE_PUBLIC_KEY_PRODUCTION" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown environment: $TARGET"; exit 1 ;;
          esac

      - name: Check approver for production
        if: inputs.environment == 'production'
        env:
          ACTOR: ${{ github.triggering_actor }}
          APPROVERS: ${{ vars.RELEASE_APPROVERS }}
        run: echo ",$APPROVERS," | tr -d ' ' | grep -q ",$ACTOR," || { echo "::error::@$ACTOR is not in RELEASE_APPROVERS"; exit 1; }

      - name: Check Cloudflare credentials are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] && exit 0
          echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings -> Secrets and variables -> Actions)"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      # Only the Worker's dependencies (wrangler from the lockfile), and no install scripts, in the job that handles the key.
      - run: npm ci --ignore-scripts --workspace apps/api --include-workspace-root=false

      - name: Stop if a key is already set (or the Worker cannot be read)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ steps.env.outputs.wrangler }}
          TARGET: ${{ inputs.environment }}
          REPLACE: ${{ inputs.replace }}
          CONFIRM: ${{ inputs.confirm }}
        # Lists secret NAMES only; Cloudflare never returns secret values. Any error stops the run (fail closed).
        run: |
          if ! names="$(npx wrangler secret list --env "$WRANGLER_ENV" --format json)"; then
            echo "::error::Could not read the secrets of the $TARGET Worker. If it was never deployed, run Deploy first; otherwise check the Cloudflare token and try again."
            exit 1
          fi
          echo "$names" | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))" \
            || { echo "::error::Unexpected answer from Cloudflare; nothing was changed"; exit 1; }
          if echo "$names" | grep -q '"LICENCE_SIGNING_KEY"'; then
            if [ "$REPLACE" != "true" ]; then
              echo "::error::LICENCE_SIGNING_KEY is already set on $TARGET. Run again with 'replace' ticked only if you mean to rotate it."
              exit 1
            fi
            if [ "$TARGET" = "production" ] && [ "$CONFIRM" != "ROTATE finealth" ]; then
              echo "::error::Rotating the production key needs confirm = ROTATE finealth"
              exit 1
            fi
            echo "::warning::Replacing the existing LICENCE_SIGNING_KEY on $TARGET. Redeploy now; Android builds need a release with the new key."
          fi

      - name: Create the key pair and store the private key in Cloudflare
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ steps.env.outputs.wrangler }}
          TARGET: ${{ inputs.environment }}
          PUB_VAR: ${{ steps.env.outputs.var }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/licence-signing-key"
          pub_file="$RUNNER_TEMP/licence-public-key"
          trap 'rm -f "$key_file"' EXIT
          node -e "
            const fs = require('node:fs');
            (async () => {
              const b64url = (b) => Buffer.from(b).toString('base64url');
              const kp = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
              fs.writeFileSync(process.argv[1], b64url(await crypto.subtle.exportKey('pkcs8', kp.privateKey)), { mode: 0o600 });
              fs.writeFileSync(process.argv[2], b64url(await crypto.subtle.exportKey('raw', kp.publicKey)));
            })();" "$key_file" "$pub_file"
          echo "::add-mask::$(cat "$key_file")"
          npx wrangler secret put LICENCE_SIGNING_KEY --env "$WRANGLER_ENV" < "$key_file"
          pub="$(cat "$pub_file")"
          {
            echo "## Licence keys created for \`$TARGET\`"
            echo
            echo "The private key is stored as the Worker secret \`LICENCE_SIGNING_KEY\`. It was never printed."
            echo
            echo "**Public key** (safe to share). Put it in the repository variable \`$PUB_VAR\`"
            echo "(Settings -> Secrets and variables -> Actions -> Variables):"
            echo
            echo '```'
            echo "$pub"
            echo '```'
            echo
            echo "Then run **Actions -> Deploy -> Run workflow** so the website is rebuilt with it."
            [ "$TARGET" = "production" ] && echo "For the Android app, set the same value as \`EXPO_PUBLIC_LICENCE_PUBLIC_KEY\` in the EAS production environment."
            true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$PUB_VAR::$pub"
